<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="marketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="growthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#marketBg)" />
  <circle cx="200" cy="180" r="160" fill="#22c55e" filter="blur(80px)" opacity="0.25" />
  <circle cx="620" cy="300" r="170" fill="#eab308" filter="blur(80px)" opacity="0.2" />

  <g transform="translate(180, 75)">
    <rect width="440" height="350" rx="20" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1.5" />
    
    <!-- Chart / Growth Icon -->
    <g transform="translate(130, 40)">
      <!-- Megaphone / Chart -->
      <line x1="20" y1="130" x2="170" y2="130" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      <line x1="20" y1="20" x2="20" y2="130" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      
      <!-- Bars -->
      <rect x="40" y="85" width="22" height="45" rx="4" fill="#3b82f6" />
      <rect x="75" y="60" width="22" height="70" rx="4" fill="#06b6d4" />
      <rect x="110" y="35" width="22" height="95" rx="4" fill="#10b981" />
      <rect x="145" y="10" width="22" height="120" rx="4" fill="#22c55e" />

      <!-- Growth Arrow -->
      <path d="M 30 90 Q 90 60 160 15" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" />
      <polygon points="160,15 145,18 155,28" fill="#facc15" />
    </g>

    <text x="220" y="275" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">تسويق إلكتروني وإعلانات ممولة</text>
    <text x="220" y="305" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="14" fill="#bbf7d0" text-anchor="middle">تحسين SEO • حملات سناب وإنستغرام • خطط تسويق</text>
  </g>
</svg>
