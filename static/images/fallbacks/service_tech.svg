<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <pattern id="matrixGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(59, 130, 246, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#techBg)" />
  <rect width="100%" height="100%" fill="url(#matrixGrid)" />

  <!-- Glowing nodes -->
  <circle cx="220" cy="180" r="160" fill="#3b82f6" filter="blur(70px)" opacity="0.25" />
  <circle cx="600" cy="300" r="190" fill="#8b5cf6" filter="blur(80px)" opacity="0.2" />

  <!-- Code / Laptop Frame -->
  <g transform="translate(160, 75)">
    <!-- Terminal Window -->
    <rect width="480" height="350" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 464 0 Q 480 0 480 16 L 480 44 L 0 44 Z" fill="rgba(30, 41, 59, 0.7)" />
    <circle cx="30" cy="22" r="6" fill="#ef4444" />
    <circle cx="50" cy="22" r="6" fill="#f59e0b" />
    <circle cx="70" cy="22" r="6" fill="#10b981" />
    <text x="240" y="27" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">terminal &lt;dev.py&gt;</text>

    <!-- Code Lines / Icons -->
    <g transform="translate(40, 70)">
      <!-- Code bracket symbol -->
      <path d="M 170 30 L 140 60 L 170 90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 230 30 L 260 60 L 230 90" stroke="#a855f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <line x1="210" y1="25" x2="190" y2="95" stroke="#10b981" stroke-width="5" stroke-linecap="round" />

      <!-- Code mock rows -->
      <rect x="20" y="120" width="120" height="10" rx="5" fill="#38bdf8" opacity="0.7" />
      <rect x="150" y="120" width="80" height="10" rx="5" fill="#a855f7" opacity="0.6" />
      <rect x="20" y="145" width="220" height="8" rx="4" fill="rgba(255,255,255,0.15)" />
      <rect x="50" y="165" width="180" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
      <rect x="50" y="185" width="260" height="8" rx="4" fill="#10b981" opacity="0.5" />
      <rect x="20" y="205" width="90" height="8" rx="4" fill="rgba(255,255,255,0.15)" />
    </g>

    <text x="240" y="325" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">برمجة وتطوير البرمجيات</text>
  </g>
</svg>
