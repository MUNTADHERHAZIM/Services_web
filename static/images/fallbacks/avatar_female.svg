<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="femaleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <clipPath id="avatarFemaleClip">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#femaleBg)" stroke="#f472b6" stroke-width="4" />

  <g clip-path="url(#avatarFemaleClip)">
    <!-- Back Hair Flow -->
    <path d="M 52 80 C 52 140, 60 170, 75 185 L 125 185 C 140 170, 148 140, 148 80 Z" fill="#3b0764" />

    <!-- Shoulders / Dress -->
    <path d="M 40 185 C 40 145, 65 138, 100 138 C 135 138, 160 145, 160 185 Z" fill="url(#dressGrad)" />
    
    <!-- Neck -->
    <rect x="93" y="115" width="14" height="25" fill="#fcd34d" rx="3" />
    <!-- Face -->
    <ellipse cx="100" cy="85" rx="34" ry="40" fill="#fde68a" />
    
    <!-- Front Hair & Hijab / Hairstyle -->
    <path d="M 64 75 C 64 45, 80 40, 100 40 C 120 40, 136 45, 136 75 C 136 58, 120 50, 100 50 C 80 50, 64 58, 64 75 Z" fill="#581c87" />
    <path d="M 64 75 C 62 105, 66 125, 74 135 C 72 115, 70 95, 78 80 Z" fill="#581c87" />
    <path d="M 136 75 C 138 105, 134 125, 126 135 C 128 115, 130 95, 122 80 Z" fill="#581c87" />

    <!-- Ears -->
    <circle cx="65" cy="88" r="6" fill="#fde68a" />
    <circle cx="135" cy="88" r="6" fill="#fde68a" />

    <!-- Eyes -->
    <circle cx="88" cy="86" r="3.5" fill="#1e293b" />
    <circle cx="112" cy="86" r="3.5" fill="#1e293b" />
    <!-- Eyelashes -->
    <path d="M 83 83 L 88 84" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 117 83 L 112 84" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />

    <!-- Lips -->
    <path d="M 92 105 Q 100 112 108 105" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
