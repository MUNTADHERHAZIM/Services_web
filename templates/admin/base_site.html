{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | منصة خدماتي - الإدارة{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" style="display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; color: #ffffff; text-decoration: none;">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; background: rgba(16, 185, 129, 0.25); border-radius: 8px; color: #10b981;">
            <i class="bi bi-shield-lock-fill fs-5"></i>
        </span>
        منصة خدماتي | لوحة الإدارة المركزية
    </a>
</div>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
    /* ==========================================================================
       منصة خدماتي - نظام ألوان لوحة الإدارة المتناسق (الوضع الليلي والنهاري المتكامل)
       ========================================================================== */

    /* 1. الوضع النهاري (Light Mode) */
    :root, html[data-theme="light"] {
        --primary: #0d9488;
        --secondary: #0f766e;
        --accent: #6366f1;
        --primary-fg: #ffffff;

        --body-fg: #1e293b;
        --body-bg: #f8fafc;
        --body-quiet-color: #64748b;
        --body-medium-color: #475569;
        --body-loud-color: #0f172a;

        --header-bg: #0f172a;
        --header-color: #ffffff;
        --header-link-color: #f8fafc;

        --breadcrumbs-bg: #1e293b;
        --breadcrumbs-fg: #f8fafc;
        --breadcrumbs-link-fg: #38bdf8;

        --link-fg: #0d9488;
        --link-hover-color: #0f766e;
        --link-selected-fg: #0d9488;

        --hairline-color: #e2e8f0;
        --border-color: #cbd5e1;

        --darkened-bg: #f1f5f9;
        --selected-bg: #e2e8f0;
        --selected-row: #e0f2fe;

        --sidebar-bg: #ffffff;
        --sidebar-border: #e2e8f0;
        --card-bg: #ffffff;
        --filter-bg: #ffffff;
        --filter-header-bg: #f1f5f9;
        --table-header-bg: #f1f5f9;
        --table-header-fg: #334155;
        --input-bg: #ffffff;
        --input-border: #cbd5e1;
        --input-fg: #1e293b;
        --badge-bg: #e2e8f0;

        color-scheme: light;
    }

    /* 2. الوضع الليلي التلقائي حسب النظام (System Dark Mode) */
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --primary: #10b981;
            --secondary: #059669;
            --accent: #818cf8;
            --primary-fg: #ffffff;

            --body-fg: #e2e8f0;
            --body-bg: #0f172a;
            --body-quiet-color: #94a3b8;
            --body-medium-color: #cbd5e1;
            --body-loud-color: #ffffff;

            --header-bg: #090d16;
            --header-color: #ffffff;
            --header-link-color: #f8fafc;

            --breadcrumbs-bg: #141c2e;
            --breadcrumbs-fg: #f8fafc;
            --breadcrumbs-link-fg: #38bdf8;

            --link-fg: #38bdf8;
            --link-hover-color: #7dd3fc;
            --link-selected-fg: #38bdf8;

            --hairline-color: #1e293b;
            --border-color: #334155;

            --darkened-bg: #182234;
            --selected-bg: #1e293b;
            --selected-row: #1e3a5f;

            --sidebar-bg: #111827;
            --sidebar-border: #1e293b;
            --card-bg: #111827;
            --filter-bg: #111827;
            --filter-header-bg: #1e293b;
            --table-header-bg: #182234;
            --table-header-fg: #f1f5f9;
            --input-bg: #182234;
            --input-border: #334155;
            --input-fg: #f1f5f9;
            --badge-bg: #1e293b;

            color-scheme: dark;
        }
    }

    /* 3. الوضع الليلي الإجباري عند تفعيله (Explicit Dark Theme) */
    html[data-theme="dark"] {
        --primary: #10b981;
        --secondary: #059669;
        --accent: #818cf8;
        --primary-fg: #ffffff;

        --body-fg: #e2e8f0;
        --body-bg: #0f172a;
        --body-quiet-color: #94a3b8;
        --body-medium-color: #cbd5e1;
        --body-loud-color: #ffffff;

        --header-bg: #090d16;
        --header-color: #ffffff;
        --header-link-color: #f8fafc;

        --breadcrumbs-bg: #141c2e;
        --breadcrumbs-fg: #f8fafc;
        --breadcrumbs-link-fg: #38bdf8;

        --link-fg: #38bdf8;
        --link-hover-color: #7dd3fc;
        --link-selected-fg: #38bdf8;

        --hairline-color: #1e293b;
        --border-color: #334155;

        --darkened-bg: #182234;
        --selected-bg: #1e293b;
        --selected-row: #1e3a5f;

        --sidebar-bg: #111827;
        --sidebar-border: #1e293b;
        --card-bg: #111827;
        --filter-bg: #111827;
        --filter-header-bg: #1e293b;
        --table-header-bg: #182234;
        --table-header-fg: #f1f5f9;
        --input-bg: #182234;
        --input-border: #334155;
        --input-fg: #f1f5f9;
        --badge-bg: #1e293b;

        color-scheme: dark;
    }

    /* تطبيق الخط والاتجاه */
    html, body {
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        direction: rtl !important;
        text-align: right !important;
        background-color: var(--body-bg) !important;
        color: var(--body-fg) !important;
    }

    /* رأس الصفحة والقوائم العلوية */
    #header {
        background: var(--header-bg) !important;
        color: var(--header-color) !important;
        padding: 12px 24px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #header a:link, #header a:visited {
        color: var(--header-link-color) !important;
    }

    #user-tools {
        font-size: 0.85rem !important;
        display: flex;
        align-items: center;
        gap: 12px;
        direction: rtl !important;
    }
    #user-tools a {
        border-bottom: none !important;
        color: #38bdf8 !important;
        font-weight: 600 !important;
    }

    /* زر تبديل الثيم */
    .theme-toggle {
        background: rgba(255, 255, 255, 0.12) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        border-radius: 6px !important;
        color: #ffffff !important;
        padding: 4px 8px !important;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .theme-toggle:hover {
        background: rgba(255, 255, 255, 0.25) !important;
    }
    .theme-toggle svg {
        fill: #ffffff !important;
        width: 16px;
        height: 16px;
    }

    /* مسار التنقل Breadcrumbs */
    div.breadcrumbs {
        background: var(--breadcrumbs-bg) !important;
        color: var(--body-quiet-color) !important;
        padding: 10px 24px !important;
        font-size: 0.85rem !important;
        border-bottom: 1px solid var(--border-color) !important;
    }
    div.breadcrumbs a {
        color: var(--breadcrumbs-link-fg) !important;
        font-weight: 500;
    }

    /* شريط التطبيقات الجانبي (Nav Sidebar) */
    #nav-sidebar {
        background: var(--sidebar-bg) !important;
        border-left: 1px solid var(--sidebar-border) !important;
        border-right: none !important;
    }
    #nav-sidebar .module caption, 
    #nav-sidebar .module th {
        background: var(--filter-header-bg) !important;
        color: var(--body-loud-color) !important;
        font-weight: 700;
        text-align: right !important;
    }
    #nav-sidebar th a, 
    #nav-sidebar td a {
        color: var(--body-fg) !important;
        text-decoration: none;
    }
    #nav-sidebar th a:hover,
    #nav-sidebar td a:hover {
        color: var(--primary) !important;
    }
    #nav-sidebar tr.current-model th a {
        color: var(--primary) !important;
        font-weight: 700;
    }
    #nav-sidebar tr:hover {
        background: var(--darkened-bg) !important;
    }

    /* جدول البيانات (Changelist Table) المتناسق بالكامل */
    #changelist table {
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border-color) !important;
        background: var(--body-bg) !important;
        width: 100%;
    }

    #changelist table thead th {
        background: var(--table-header-bg) !important;
        color: var(--table-header-fg) !important;
        font-weight: 700 !important;
        text-align: right !important;
        border-bottom: 2px solid var(--border-color) !important;
        padding: 10px 14px !important;
    }
    #changelist table thead th a {
        color: var(--table-header-fg) !important;
    }

    /* صفوف الجدول المتناوبة بألوان متناسقة ومريحة للعين */
    #changelist table tbody tr:nth-child(odd) {
        background: var(--body-bg) !important;
        color: var(--body-fg) !important;
    }
    #changelist table tbody tr:nth-child(even) {
        background: var(--darkened-bg) !important;
        color: var(--body-fg) !important;
    }
    #changelist table tbody tr:hover {
        background: var(--selected-bg) !important;
    }
    #changelist table tbody td, 
    #changelist table tbody th {
        color: var(--body-fg) !important;
        border-color: var(--hairline-color) !important;
        padding: 10px 14px !important;
        vertical-align: middle;
    }
    #changelist table tbody td a, 
    #changelist table tbody th a {
        color: var(--link-fg) !important;
    }

    /* شريط البحث والفلترة العلوية */
    #toolbar {
        background: var(--darkened-bg) !important;
        border: 1px solid var(--border-color) !important;
        border-radius: 8px !important;
        padding: 10px 14px !important;
        margin-bottom: 15px !important;
    }
    #toolbar form input[type="text"] {
        background: var(--input-bg) !important;
        color: var(--input-fg) !important;
        border: 1px solid var(--input-border) !important;
        border-radius: 6px !important;
        padding: 6px 12px !important;
    }

    /* شريط الفلاتر الجانبي (Changelist Filter) */
    #changelist-filter {
        background: var(--filter-bg) !important;
        border-right: 1px solid var(--border-color) !important;
        border-left: none !important;
        color: var(--body-fg) !important;
    }
    #changelist-filter h2 {
        background: var(--filter-header-bg) !important;
        color: var(--body-loud-color) !important;
        font-weight: 700 !important;
        border-bottom: 1px solid var(--border-color) !important;
        text-align: right !important;
        padding: 10px 14px !important;
    }
    #changelist-filter h3 {
        color: var(--body-quiet-color) !important;
        font-weight: 600 !important;
        padding: 0 14px !important;
    }
    #changelist-filter ul {
        padding: 0 14px 10px !important;
    }
    #changelist-filter a {
        color: var(--link-fg) !important;
    }
    #changelist-filter li.selected {
        border-right: 3px solid var(--primary) !important;
        padding-right: 6px;
    }
    #changelist-filter li.selected a {
        color: var(--primary) !important;
        font-weight: 700 !important;
    }

    /* صندوق الإجراءات الجماعية (Actions) */
    .actions {
        background: var(--darkened-bg) !important;
        border: 1px solid var(--border-color) !important;
        border-radius: 6px !important;
        padding: 8px 14px !important;
        color: var(--body-fg) !important;
    }
    .actions label {
        color: var(--body-fg) !important;
    }
    .actions select {
        background: var(--input-bg) !important;
        color: var(--input-fg) !important;
        border: 1px solid var(--input-border) !important;
        border-radius: 6px !important;
        padding: 4px 10px !important;
    }

    /* الأزرار العامة */
    .button, input[type=submit], input[type=button], .submit-row input, a.button {
        background: #10b981 !important;
        color: #ffffff !important;
        border-radius: 6px !important;
        padding: 8px 16px !important;
        font-weight: 600 !important;
        font-family: 'Tajawal', sans-serif !important;
        border: none !important;
        transition: all 0.2s ease !important;
        cursor: pointer;
    }
    .button:hover, input[type=submit]:hover, a.button:hover {
        background: #059669 !important;
        transform: translateY(-1px);
    }
    .button.default, input[type=submit].default {
        background: #0f172a !important;
    }
    html[data-theme="dark"] .button.default,
    html[data-theme="dark"] input[type=submit].default {
        background: #1e293b !important;
        border: 1px solid #334155 !important;
    }
    .deletelink, a.deletelink {
        background: #ef4444 !important;
        color: #ffffff !important;
        border-radius: 6px !important;
    }

    /* حقول الإدخال والنماذج */
    input[type=text], input[type=password], input[type=email], input[type=url], 
    input[type=number], input[type=tel], textarea, select {
        background: var(--input-bg) !important;
        color: var(--input-fg) !important;
        border: 1px solid var(--input-border) !important;
        border-radius: 6px !important;
        padding: 7px 12px !important;
        font-family: 'Tajawal', sans-serif !important;
    }
    input:focus, textarea:focus, select:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2) !important;
    }

    /* البطاقات والمربعات في لوحة التحكم الرئيسية */
    .dashboard .module {
        background: var(--card-bg) !important;
        border: 1px solid var(--border-color) !important;
        border-radius: 8px;
    }
    .dashboard .module caption {
        background: var(--filter-header-bg) !important;
        color: var(--body-loud-color) !important;
        font-weight: 700;
    }

    /* ترقيم الصفحات */
    .paginator {
        background: var(--darkened-bg) !important;
        border: 1px solid var(--border-color) !important;
        color: var(--body-fg) !important;
        border-radius: 6px;
        padding: 8px 14px;
        margin-top: 15px;
    }
</style>
{% endblock %}
